name: Native ownership

on:
  pull_request:
    paths:
      - '4DPlugin*'
      - '4D Plugin API/**'
      - '.github/tests/ownership_host.mm'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'
  push:
    branches: [master]
    paths:
      - '4DPlugin*'
      - '4D Plugin API/**'
      - '.github/tests/ownership_host.mm'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synthetic engine-boundary regression (unsigned, no event logging)
        run: python3 -m unittest discover -s .github/tests -p test_ownership.py -v
