# Commits coordinated SOURCE metadata only. Build is a separate manual action.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: validate, bump and push selected branch
        id: bump
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/release_lifecycle.py bump "$MODE"

      - name: summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "### Source version bumped to $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "No tag or build created. Run Build separately on the updated branch." >> "$GITHUB_STEP_SUMMARY"
